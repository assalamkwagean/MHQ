<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHQ Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="app-header">
                <img src="logo_pondok.png" alt="Logo" class="logo">
                <h2>Musabaqoh Hidzil Qur'an<br><span>Pondok As-Salam Fathul Ulum Kwagean</span></h2>
            </div>
            <div class="menu-header">
                <h3>Menu Soal</h3>
                <div class="menu-controls">
                    <div class="toggle-switch">
                        <label for="highlighter-toggle">Highlighter:</label>
                        <input type="checkbox" id="highlighter-toggle" class="toggle-input">
                        <label for="highlighter-toggle" class="toggle-label"></label>
                    </div>
                    <button id="theme-toggle" title="Ganti Tema">🌙</button>
                    <a href="settings.html" class="settings-btn" title="Pengaturan Soal">⚙️</a>
                </div>
            </div>
            <div id="menu-soal"></div>
        </div>
        <div class="content">
            <div id="pdf-viewer"></div>
            <div id="pdf-highlighter"></div>
            <div class="pdf-navigation">
                <button id="fit-width" title="Fit Lebar">↔</button>
                <button id="fit-page" title="Fit Halaman">↕</button>
                <button id="prev-page" title="Halaman Sebelumnya">▲</button>
                <button id="next-page" title="Halaman Berikutnya">▼</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
</body>
</html>
