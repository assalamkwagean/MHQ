<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Soal MHQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <h1>Pengaturan Soal</h1>
            <button id="theme-toggle" title="Ganti Tema">🌙</button>
        </div>
        <p>Ubah, tambah, atau hapus kategori, paket, dan soal di bawah ini. Klik "Simpan & Unduh" untuk mendapatkan file <code>soal.json</code> yang baru.</p>

        <div id="editor-container">
            <!-- Konten editor akan dibuat oleh JavaScript -->
        </div>

        <button id="add-kategori-btn" class="btn">Tambah Kategori Baru</button>
        <hr>
        <button id="save-btn" class="btn btn-primary">Simpan & Unduh soal.json</button>
        <a href="index.html" class="btn btn-secondary">Kembali ke Aplikasi Utama</a>
    </div>

    <script src="theme.js"></script>
    <script src="settings.js"></script>
</body>
</html>
